<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页迹 PageTrail · 本地资料检索与复习</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --paper: #f7f4ec;
    --card: #fffdf8;
    --ink: #26221c;
    --muted: #7b7367;
    --line: #e2dbcd;
    --accent: #1d6f5f;
    --accent-soft: #e4f0eb;
    --warn: #b4552f;
    --shadow: 0 1px 2px rgba(38, 34, 28, .05), 0 8px 24px rgba(38, 34, 28, .06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  .logo {
    width: 38px; height: 38px; border-radius: 10px; background: var(--accent);
    color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px;
  }
  h1 { font-size: 19px; margin: 0; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; }
  .badge {
    margin-left: auto; font-size: 12px; color: var(--accent);
    background: var(--accent-soft); padding: 6px 12px; border-radius: 999px;
  }
  main {
    max-width: 1180px; margin: 0 auto; padding: 26px 24px 60px;
    display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px;
  }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .search { padding: 18px; }
  .search-row { display: flex; gap: 10px; }
  input[type=search] {
    flex: 1; padding: 12px 14px; font-size: 15px; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--ink); outline: none;
  }
  input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); padding: 9px 14px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 12px 22px; }
  button:hover { border-color: var(--accent); }
  .filters { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  select {
    font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
    background: #fff; color: var(--ink);
  }
  .channels { display: flex; gap: 6px; margin-left: auto; }
  .channels button { padding: 7px 13px; font-size: 13px; }
  .channels button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .results { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .hit { padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .hit-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .hit-title { font-weight: 600; }
  .hit-src { color: var(--muted); font-size: 13px; }
  .score { margin-left: auto; font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .snippet { margin: 8px 0 10px; color: #3b352c; }
  mark { background: #fde9a9; padding: 0 2px; border-radius: 3px; }
  .tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
  .tag.topic { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
  .grade { margin-left: auto; display: flex; gap: 6px; }
  .grade button { font-size: 12px; padding: 5px 10px; }
  aside { display: flex; flex-direction: column; gap: 16px; }
  .side { padding: 16px 18px; }
  .side h2 { font-size: 14px; margin: 0 0 4px; letter-spacing: .4px; }
  .side .hint { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .queue-item { padding: 9px 0; border-top: 1px dashed var(--line); font-size: 13px; }
  .queue-item:first-of-type { border-top: 0; }
  .queue-item b { font-weight: 600; }
  .queue-item span { color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 14px 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
  .stat { background: var(--paper); border-radius: 9px; padding: 9px 11px; }
  .stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 24px 32px; }
  .error { color: var(--warn); font-size: 13px; padding: 8px 0; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .channels { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">页</div>
  <div>
    <h1>页迹 PageTrail</h1>
    <div class="sub">在你的资料里，找到那一页，并记得住</div>
  </div>
  <div class="badge" id="engine-badge">seekdb 嵌入式 · 混合检索</div>
</header>

<main>
  <section class="panel search">
    <div class="search-row">
      <input id="q" type="search" placeholder="试试：Paxos 两阶段投票 / 学习率震荡 / 验证集过拟合" autocomplete="off">
      <button class="primary" id="go">检索</button>
    </div>
    <div class="filters">
      <select id="doc"><option value="">全部资料</option></select>
      <select id="topic"><option value="">全部主题</option></select>
      <div class="channels" id="channels">
        <button data-channel="hybrid" class="active">混合</button>
        <button data-channel="fulltext">全文</button>
        <button data-channel="vector">向量</button>
      </div>
    </div>
    <div id="results" class="results"></div>
  </section>

  <aside>
    <section class="panel side">
      <h2>复习队列</h2>
      <div class="hint" id="queue-hint">评分后按间隔重复安排复习</div>
      <div id="queue"></div>
    </section>
    <section class="panel side">
      <h2>资料库</h2>
      <div class="hint">存于 seekdb 的同一张 collection</div>
      <div class="stats" id="stats"></div>
    </section>
  </aside>
</main>
<footer>数据存储与检索：seekdb（嵌入式） · 全文 $contains + 向量余弦 + RRF 融合</footer>

<script>
const state = { channel: "hybrid", doc: "", topic: "" };

function el(id) { return document.getElementById(id); }

function snippet(text, query) {
  const terms = query.split(/\s+/).filter(Boolean);
  let html = text.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  for (const term of terms) {
    if (term.length < 1) continue;
    const safe = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    html = html.replace(new RegExp(safe, "gi"), m => `<mark>${m}</mark>`);
  }
  return html;
}

function render(result, query) {
  const box = el("results");
  if (!result.results.length) {
    box.innerHTML = `<div class="empty">没有命中，换个说法或放宽筛选。</div>`;
    return;
  }
  box.innerHTML = result.results.map((hit, index) => `
    <article class="hit">
      <div class="hit-top">
        <span class="hit-title">${index + 1}. ${hit.meta.title}</span>
        <span class="hit-src">${hit.meta.source} · 第 ${hit.meta.page} 页</span>
        <span class="score">${hit.distance === null ? "" : "distance " + hit.distance.toFixed(4)}</span>
      </div>
      <p class="snippet">${snippet(hit.text, query)}</p>
      <div class="tags">
        <span class="tag topic">${hit.meta.topic}</span>
        <span class="tag">${hit.id}</span>
        <span class="tag">${hit.meta.state === "new" ? "未安排复习" : "已安排 · " + hit.meta.state}</span>
        <span class="grade">
          <button data-grade="good" data-id="${hit.id}">熟练</button>
          <button data-grade="hard" data-id="${hit.id}">一般</button>
          <button data-grade="again" data-id="${hit.id}">吃力</button>
        </span>
      </div>
    </article>`).join("");
  box.querySelectorAll("button[data-grade]").forEach(btn => {
    btn.addEventListener("click", () => review(btn.dataset.id, btn.dataset.grade));
  });
}

async function search() {
  const query = el("q").value.trim();
  if (!query) { el("results").innerHTML = `<div class="empty">输入关键词开始检索。</div>`; return; }
  const params = new URLSearchParams({ q: query, channel: state.channel, doc: state.doc, topic: state.topic });
  const response = await fetch("/api/search?" + params);
  render(await response.json(), query);
}

async function review(id, result) {
  const response = await fetch("/api/review", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, result })
  });
  const payload = await response.json();
  if (payload.error) { alert(payload.error); return; }
  renderQueue(payload.queue);
  renderStats(payload.queue.stats);
  search();
}

function queueItem(row, label) {
  const meta = row.meta;
  return `<div class="queue-item"><b>${meta.title}</b> · 第 ${meta.page} 页<br>
    <span>${meta.topic} · ${label} · 间隔 ${meta.interval_days} 天</span></div>`;
}

function renderQueue(queue) {
  const parts = [];
  if (queue.due_today.length) {
    el("queue-hint").textContent = `今天到期 ${queue.due_today.length} 条`;
    parts.push(queue.due_today.map(row => queueItem(row, "今天到期")).join(""));
  } else {
    el("queue-hint").textContent = "今天没有到期条目";
  }
  if (queue.due_tomorrow.length) {
    parts.push(`<div class="queue-item" style="border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding-top:10px">明天到期 ${queue.due_tomorrow.length} 条</div>`);
    parts.push(queue.due_tomorrow.map(row => queueItem(row, "明天到期")).join(""));
  }
  el("queue").innerHTML = parts.join("") || `<div class="empty">检索结果评分后出现在这里。</div>`;
}

function renderStats(stats) {
  if (!stats) return;
  const states = stats.by_state || {};
  el("stats").innerHTML = `
    <div class="stat"><b>${stats.total}</b><span>摘录总数</span></div>
    <div class="stat"><b>${stats.by_doc ? Object.keys(stats.by_doc).length : 0}</b><span>资料份数</span></div>
    <div class="stat"><b>${states.new || 0}</b><span>未安排</span></div>
    <div class="stat"><b>${(states.review || 0) + (states.learning || 0)}</b><span>在复习</span></div>`;
}

async function loadMeta() {
  const response = await fetch("/api/meta");
  const meta = await response.json();
  if (meta.error) { el("results").innerHTML = `<div class="error">${meta.error}</div>`; return; }
  for (const doc of meta.documents) {
    el("doc").insertAdjacentHTML("beforeend", `<option value="${doc.doc_id}">${doc.title}</option>`);
  }
  for (const topic of meta.topics) {
    el("topic").insertAdjacentHTML("beforeend", `<option value="${topic}">${topic}</option>`);
  }
  renderQueue(meta.queue);
  renderStats(meta.stats);
  applyDeepLink(meta);
}

function applyDeepLink(meta) {
  const params = new URLSearchParams(location.search);
  const query = params.get("q");
  const channel = params.get("channel");
  if (channel && ["hybrid", "fulltext", "vector"].includes(channel)) {
    state.channel = channel;
    document.querySelectorAll("#channels button").forEach(btn => btn.classList.toggle("active", btn.dataset.channel === channel));
  }
  if (params.get("doc") && meta.documents.some(doc => doc.doc_id === params.get("doc"))) {
    state.doc = params.get("doc");
    el("doc").value = state.doc;
  }
  if (params.get("topic") && meta.topics.includes(params.get("topic"))) {
    state.topic = params.get("topic");
    el("topic").value = state.topic;
  }
  if (query) {
    el("q").value = query;
    search();
  }
}

el("go").addEventListener("click", search);
el("q").addEventListener("keydown", event => { if (event.key === "Enter") search(); });
el("doc").addEventListener("change", event => { state.doc = event.target.value; search(); });
el("topic").addEventListener("change", event => { state.topic = event.target.value; search(); });
el("channels").addEventListener("click", event => {
  const button = event.target.closest("button[data-channel]");
  if (!button) return;
  state.channel = button.dataset.channel;
  document.querySelectorAll("#channels button").forEach(item => item.classList.toggle("active", item === button));
  search();
});
loadMeta();
</script>
</body>
</html>
