version: 0.3.1
kind: app
app:
  name: 记忆侦探：三扇数据库之门
  description: Dify 主导规则与回合编排，seekdb 保存跨会话进度。无需外部模型密钥。
  icon: 🗝️
  icon_background: '#E4FBCC'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 200
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        title: 侦探身份与行动
        type: start
        desc: ''
        selected: false
        variables:
        - label: 玩家代号（英文字母、数字、下划线）
          variable: player_id
          type: text-input
          required: true
          max_length: 64
          options: []
        - label: 行动：开始 / 提示 / 答案 / 继续 / 重开
          variable: action
          type: text-input
          required: true
          max_length: 200
          options: []
    - id: prepare
      type: custom
      position:
        x: 310
        y: 200
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        title: 校验代号
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "import re\ndef main(player_id: str) -> dict:\n    if not re.fullmatch(r'[a-zA-Z0-9_-]{1,64}',\
          \ player_id):\n        raise ValueError('玩家代号格式不正确')\n    return {'player':player_id}\n"
        variables:
        - variable: player_id
          value_selector:
          - start
          - player_id
        outputs:
          player:
            type: string
            children: null
    - id: load
      type: custom
      position:
        x: 620
        y: 200
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        title: 从 seekdb 恢复档案
        type: http-request
        desc: ''
        selected: false
        method: GET
        url: http://host.docker.internal:18747/state/{{#prepare.player#}}
        authorization:
          type: no-auth
        headers: Content-Type:application/json
        params: ''
        body:
          type: none
          data: []
        timeout:
          connect: 10
          read: 30
          write: 30
        retry_config:
          retry_enabled: false
          max_retries: 0
          retry_interval: 1000
        ssl_verify: true
    - id: game
      type: custom
      position:
        x: 930
        y: 200
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        title: 推理、线索与关卡规则
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "\"\"\"Dify Code 节点中的完整游戏规则；不在存储服务中执行。\"\"\"\nimport json\n\nROOMS =\
          \ [\n    {\"name\": \"丢失的检索室\", \"clue\": \"管理员只记得一个词，访客只记得意思。两份排名需要合成同一份答案。请说出这种检索方式。\"\
          , \"answers\": [\"混合检索\", \"hybrid search\", \"混合搜索\"], \"hint\": \"同时使用关键词和向量，答案是四个汉字。\"\
          , \"fact\": \"混合检索结合关键词与向量相似度，可由数据库使用 RRF 融合候选排名。\"},\n    {\"name\": \"\
          时间回声走廊\", \"clue\": \"你关掉应用后再回来，我仍记得你的分数。只存在浏览器变量里的我做不到。请说出这种能力。\", \"answers\"\
          : [\"持久化\", \"persistence\", \"数据持久化\"], \"hint\": \"把状态保存进数据库，而不是只留在内存。\"\
          , \"fact\": \"本游戏每回合从 seekdb 读取进度并持久化，Dify 不依赖上一次运行的临时变量。\"},\n    {\"name\"\
          : \"并发双影门\", \"clue\": \"两名分身同时读取旧进度，各自提交。怎样避免后提交的人覆盖先提交者？请说出锁策略。\", \"\
          answers\": [\"乐观锁\", \"optimistic locking\", \"版本号\", \"版本检查\"], \"hint\"\
          : \"读取时带回 revision，写入时比较这个版本号。\", \"fact\": \"本游戏用带 revision 条件的 UPDATE\
          \ 实现乐观并发控制，冲突时返回 409。\"},\n]\n\ndef main(body: str, action: str) -> dict:\n\
          \    loaded=json.loads(body)\n    state=loaded['state']\n    action=action.strip()\n\
          \    command=action.casefold()\n    if command in ['重开','restart']:\n  \
          \      state={'room':0,'score':0,'attempts':0,'hints':0,'history':[]}\n\
          \        message='新的档案已开启。'\n    elif state['room'] >= len(ROOMS):\n   \
          \     message='档案已经解密！输入“重开”可重新挑战。'\n    elif command in ['提示','hint']:\n\
          \        state['hints']+=1\n        message=ROOMS[state['room']]['hint']\n\
          \    elif command in ['开始','继续','start','continue','']:\n        message='欢迎回来，侦探。进度已从\
          \ seekdb 恢复。'\n    else:\n        room=ROOMS[state['room']]\n        state['attempts']+=1\n\
          \        correct=command in room['answers']\n        state['history'].append({'room':state['room'],'answer':action[:200],'correct':correct})\n\
          \        state['history']=state['history'][-100:]\n        if correct:\n\
          \            state['score']+=max(1,10-state['hints']*2)\n            state['room']+=1\n\
          \            state['hints']=0\n            message='破解成功！'+room['fact']\n\
          \        else:\n            message='还没有匹配证据。再想一想，或输入“提示”。'\n    if state['room']<len(ROOMS):\n\
          \        room=ROOMS[state['room']]\n        message+='\\n\\n【'+room['name']+'】\\\
          n'+room['clue']\n    else:\n        message+='\\n\\n全部三扇门已打开。'\n    message+='\\\
          n\\n分数：'+str(state['score'])+' / 30；作答次数：'+str(state['attempts'])+'。'\n\
          \    return {'payload':json.dumps({'state':state,'revision':loaded['revision']},ensure_ascii=False),'message':message}\n"
        variables:
        - variable: body
          value_selector:
          - load
          - body
        - variable: action
          value_selector:
          - start
          - action
        outputs:
          payload:
            type: string
            children: null
          message:
            type: string
            children: null
    - id: save
      type: custom
      position:
        x: 1240
        y: 200
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        title: 将本回合写入 seekdb
        type: http-request
        desc: ''
        selected: false
        method: POST
        url: http://host.docker.internal:18747/state/{{#prepare.player#}}
        authorization:
          type: no-auth
        headers: Content-Type:application/json
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: '{{#game.payload#}}'
        timeout:
          connect: 10
          read: 30
          write: 30
        retry_config:
          retry_enabled: false
          max_retries: 0
          retry_interval: 1000
        ssl_verify: true
    - id: verify
      type: custom
      position:
        x: 1550
        y: 200
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        title: 确认存档再回复
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "import json\ndef main(body: str, message: str) -> dict:\n    result=json.loads(body)\n\
          \    if not result.get('saved'):\n        raise ValueError(result.get('error','存档失败，请重试'))\n\
          \    return {'answer':message+'\\n档案已保存，版本 '+str(result['revision'])+'。'}\n"
        variables:
        - variable: body
          value_selector:
          - save
          - body
        - variable: message
          value_selector:
          - game
          - message
        outputs:
          answer:
            type: string
            children: null
    - id: end
      type: custom
      position:
        x: 1860
        y: 200
      width: 244
      height: 100
      sourcePosition: right
      targetPosition: left
      data:
        title: 侦探回合结果
        type: end
        desc: ''
        selected: false
        outputs:
        - value_selector:
          - verify
          - answer
          value_type: string
          variable: answer
    edges:
    - id: start-prepare
      source: start
      target: prepare
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: prepare-load
      source: prepare
      target: load
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: code
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: load-game
      source: load
      target: game
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: game-save
      source: game
      target: save
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: code
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: save-verify
      source: save
      target: verify
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: verify-end
      source: verify
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: code
        targetType: end
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 0.7
