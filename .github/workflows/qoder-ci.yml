name: qoder-ci

on:
  push:
    paths:
      - 'qoder/**'
      - '.github/workflows/qoder-ci.yml'
  pull_request:
    paths:
      - 'qoder/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qoder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: qoder/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Demo verification
        run: python demo.py

      - name: Web smoke
        run: |
          python -m pagetrail serve --port 8765 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/meta > meta.json; then break; fi
            sleep 1
          done
          cat meta.json
          curl -fsS "http://127.0.0.1:8765/api/search?q=%E5%88%86%E5%B8%83%E5%BC%8F%E4%BA%8B%E5%8A%A1&channel=hybrid&limit=4" > search.json
          cat search.json
          python -c "import json;d=json.load(open('search.json'));assert d['results'], d;print('hits', len(d['results']))"
          curl -fsS http://127.0.0.1:8765/ > index.html
          grep -q '<title>' index.html
